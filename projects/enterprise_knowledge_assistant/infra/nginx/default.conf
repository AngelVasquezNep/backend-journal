# The same-origin edge exposes only the committed public API and SPA.
server {
    access_log off;
    error_log /var/log/nginx/error.log crit;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    proxy_set_header X-Company-ID "";
    proxy_set_header X-Account-ID "";
    proxy_set_header X-Role "";
    proxy_set_header Authorization "";
    proxy_set_header Host $http_host;
    location ~ ^/(internal|health|metrics)(/|$) { return 404; }
    location ~ ^/api/v1/(auth(?:/|$)|users$) { proxy_pass http://identity:8000; }
    location ~ ^/api/v1/knowledge(?:/|$) { proxy_pass http://knowledge:8000; }
    location ~ ^/api/v1/chat(?:/|$) { proxy_pass http://chat:8000; }
    location /api/ { return 404; }
    location / { try_files $uri /index.html; }
}
